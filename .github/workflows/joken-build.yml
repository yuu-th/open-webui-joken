name: joken — Build & Push Docker image

on:
  push:
    branches: [joken-team-share]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: joken-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/open-webui-joken:latest
            ghcr.io/${{ github.repository_owner }}/open-webui-joken:${{ github.sha }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            USE_OLLAMA=false
            USE_CUDA=false
